name: Refresh GitHub metrics

on:
  schedule:
    - cron: "0 4 * * 1"  # Mondays, 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 assets/metrics.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898233+github-actions[bot]@users.noreply.github.com"
          git add assets/metrics-*.svg
          git diff --cached --quiet || { git commit -m "Refresh GitHub metrics"; git push; }
